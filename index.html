<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Éditeur PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #555; height: 100vh; display: flex; flex-direction: column; }
  #bar { background: #222; color: #eee; padding: 8px 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  #bar .open { padding: 4px 10px; background: #2a7; color: #fff; border-radius: 3px; cursor: pointer; }
  main { flex: 1; display: flex; min-height: 0; }
  #pages { flex: 1; overflow: auto; padding: 0 16px; }
  aside { width: 190px; overflow: auto; background: #333; color: #eee; padding: 10px; }
  aside button { width: 100%; padding: 6px; cursor: pointer; }
  aside small { display: block; opacity: .7; margin: 8px 0; }
  .thumb { position: relative; background: #fff; margin-top: 10px; padding: 6px; border-radius: 4px; }
  .thumb img { display: block; width: 100%; height: 60px; object-fit: contain; cursor: grab; }
  .thumb button { position: absolute; top: 2px; right: 2px; width: auto; padding: 0 6px; }
  .page .sig { position: absolute; resize: horizontal; overflow: hidden; outline: 1px dashed #08f8; cursor: move; min-width: 20px; }
  .page .sig:hover { outline-color: #08f; }
  .page .sig img { display: block; width: 100%; height: 100%; pointer-events: none; }
  dialog canvas { display: block; width: 500px; height: 200px; border: 1px solid #999; background: #fff; touch-action: none; cursor: crosshair; }
  dialog div { margin-top: 10px; text-align: right; }
  #bar button { padding: 4px 10px; cursor: pointer; }
  #bar button.on { background: #2a7; color: #fff; border-color: #2a7; }
  #bar small { opacity: .7; }
  .page { position: relative; margin: 16px auto; background: #fff; box-shadow: 0 2px 10px #0009; cursor: crosshair; }
  .page canvas { display: block; width: 100%; }
  .page svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .page .box { position: absolute; padding: 4px; border: 1px dashed #08f8; cursor: move; }
  .page .box:hover { border-color: #08f; }
  .page input { display: block; border: 0; padding: 0; margin: 0; background: transparent; line-height: 1;
                font-family: Helvetica, Arial, sans-serif; outline: none; cursor: text; }
  body.move .page, body.move .page input, body.move .page svg * { cursor: move; }
  .page .tl { position: absolute; display: none; cursor: text; }
  body.edit .page .tl { display: block; }
  body.edit .page .tl:hover { outline: 1px solid #f80; background: #f802; }
</style>
</head>
<body>
<div id="bar">
  <label class="open">Ouvrir un PDF<input type="file" id="file" accept="application/pdf" hidden></label>
  <span id="fname">Aucun fichier ouvert</span>
  <span id="tools">
    <button data-t="text" class="on">Texte</button>
    <button data-t="edit">Modifier texte</button>
    <button data-t="rect">Rectangle</button>
    <button data-t="ellipse">Cercle</button>
    <button data-t="line">Trait</button>
    <button data-t="move">Déplacer</button>
  </span>
  <label>Couleur <input type="color" id="color" value="#000000"></label>
  <label>Taille <input type="number" id="size" value="11" min="4" max="72" style="width:4em"></label>
  <label>Épaisseur <input type="number" id="width" value="1.5" min="0.5" max="10" step="0.5" style="width:4em"></label>
  <button id="undo">Annuler</button>
  <button id="save">Enregistrer</button>
  <small>Clic droit sur un élément = supprimer</small>
</div>
<main>
  <div id="pages"></div>
  <aside>
    <button id="signew">+ Nouvelle signature</button>
    <small>Glisse une signature sur le PDF. Coin bas-droit = redimensionner.</small>
    <div id="siglist"></div>
  </aside>
</main>
<dialog id="sigdlg">
  <p>Signe dans le cadre (souris, pavé tactile ou stylet)</p>
  <canvas id="sigpad"></canvas>
  <div><button id="sigclear">Effacer</button> <button id="sigcancel">Annuler</button> <button id="sigok">Enregistrer</button></div>
</dialog>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const S = 1.5, $ = id => document.getElementById(id), measure = document.createElement('canvas').getContext('2d');
let bytes, fileName, viewports = [], pdfPages = [], items = [], tool = 'text';

$('tools').onclick = e => {
  if (!e.target.dataset.t) return;
  tool = e.target.dataset.t;
  for (const b of $('tools').children) b.classList.toggle('on', b === e.target);
  document.body.classList.toggle('move', tool === 'move');
  document.body.classList.toggle('edit', tool === 'edit');
};
$('file').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  $('fname').textContent = f.name;
  load(new Uint8Array(await f.arrayBuffer()), f.name)
    .catch(() => alert("Impossible d'ouvrir ce fichier : ce n'est pas un PDF valide, ou il est protégé par un mot de passe."));
};
$('undo').onclick = () => items.length && remove(items.at(-1));

// --- Signatures : mémorisées dans ce navigateur (localStorage) ---
let sigs = [];
try { sigs = JSON.parse(localStorage.signatures || '[]'); } catch {}
const saveSigs = () => {
  try { localStorage.signatures = JSON.stringify(sigs); } catch { alert('Ce navigateur refuse de mémoriser les signatures.'); }
};
function renderSigs() {
  $('siglist').innerHTML = '';
  sigs.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'thumb';
    d.innerHTML = `<img src="${s.src}" draggable="true"><button title="Supprimer">✕</button>`;
    d.querySelector('img').ondragstart = e => e.dataTransfer.setData('text/plain', 'sig:' + i);
    d.querySelector('button').onclick = () => {
      if (!confirm('Supprimer cette signature ?')) return;
      sigs.splice(i, 1); saveSigs(); renderSigs();
    };
    $('siglist').append(d);
  });
}
renderSigs();

const pad = $('sigpad'), pctx = pad.getContext('2d');
$('signew').onclick = () => {
  const dpr = devicePixelRatio || 1;
  pad.width = 500 * dpr; pad.height = 200 * dpr; // réinitialise aussi le contexte
  pctx.scale(dpr, dpr);
  Object.assign(pctx, { lineWidth: 2.5, lineCap: 'round', lineJoin: 'round', strokeStyle: $('color').value });
  $('sigdlg').showModal();
};
pad.onpointerdown = e => {
  pad.setPointerCapture(e.pointerId);
  let [lx, ly] = [e.offsetX, e.offsetY];
  pad.onpointermove = ev => {
    pctx.beginPath(); pctx.moveTo(lx, ly); pctx.lineTo(ev.offsetX, ev.offsetY); pctx.stroke();
    [lx, ly] = [ev.offsetX, ev.offsetY];
  };
};
pad.onpointerup = () => pad.onpointermove = null;
$('sigclear').onclick = () => pctx.clearRect(0, 0, 500, 200);
$('sigcancel').onclick = () => $('sigdlg').close();
$('sigok').onclick = () => {
  // recadre sur le tracé pour ne pas garder de marge vide
  const { width: W, height: H } = pad, d = pctx.getImageData(0, 0, W, H).data;
  let x0 = W, y0 = H, x1 = -1, y1 = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (d[(y * W + x) * 4 + 3]) {
    x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y);
  }
  if (x1 < 0) return alert('Le cadre est vide.');
  const c = document.createElement('canvas');
  c.width = x1 - x0 + 1; c.height = y1 - y0 + 1;
  c.getContext('2d').drawImage(pad, x0, y0, c.width, c.height, 0, 0, c.width, c.height);
  sigs.push({ src: c.toDataURL('image/png'), ratio: c.width / c.height });
  saveSigs(); renderSigs(); $('sigdlg').close();
};
addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'z' && document.activeElement.type !== 'text') { e.preventDefault(); $('undo').click(); }
});

async function load(data, name) {
  bytes = data; fileName = name; items = []; viewports = []; pdfPages = []; $('pages').innerHTML = '';
  const doc = await pdfjsLib.getDocument({ data: data.slice() }).promise; // pdf.js détache le buffer qu'on lui donne
  for (let n = 1; n <= doc.numPages; n++) {
    const page = await doc.getPage(n), vp = page.getViewport({ scale: S }), dpr = devicePixelRatio || 1;
    const wrap = document.createElement('div'), canvas = document.createElement('canvas');
    wrap.className = 'page';
    wrap.style.width = vp.width + 'px'; wrap.style.height = vp.height + 'px';
    wrap.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg"></svg>';
    canvas.width = vp.width * dpr; canvas.height = vp.height * dpr;
    wrap.prepend(canvas);
    $('pages').append(wrap);
    viewports.push(vp);
    pdfPages.push(page);
    wrap.onpointerdown = e => down(e, wrap, n - 1);
    wrap.ondragover = e => e.preventDefault();
    wrap.ondrop = e => {
      e.preventDefault();
      const s = sigs[e.dataTransfer.getData('text/plain').replace('sig:', '')];
      if (!s) return;
      const r = wrap.getBoundingClientRect(), width = 150; // 150 px écran ≈ 3,5 cm sur le PDF
      add({ type: 'sig', p: n - 1, src: s.src, ratio: s.ratio, width,
            x: e.clientX - r.left - width / 2, y: e.clientY - r.top - width / s.ratio / 2 }, wrap);
    };
    await page.render({ canvasContext: canvas.getContext('2d', { willReadFrequently: true }), viewport: vp, transform: [dpr, 0, 0, dpr, 0, 0] }).promise;
    // zones cliquables sur chaque morceau de texte du PDF (outil « Modifier texte »)
    const tc = await page.getTextContent();
    for (const t of tc.items) {
      if (!t.str.trim()) continue;
      const tx = pdfjsLib.Util.transform(vp.transform, t.transform), px = Math.hypot(tx[2], tx[3]);
      if (Math.abs(tx[1]) > 0.01 * px) continue; // ponytail: texte penché/vertical à l'écran ignoré
      const d = document.createElement('div');
      d.className = 'tl';
      d.run = { str: t.str, font: t.fontName, px, x: tx[4], top: tx[5] - 0.85 * px, w: t.width * S };
      Object.assign(d.style, { left: d.run.x + 'px', top: d.run.top + 'px', width: d.run.w + 'px', height: px * 1.1 + 'px' });
      wrap.append(d);
    }
  }
}

// Police d'origine d'un morceau de texte : "ABCDEF+TimesNewRomanPS-BoldMT" → Times New Roman, gras
function fontOf(p, id) {
  let name = '';
  try { name = pdfPages[p].commonObjs.get(id).name || ''; } catch {}
  name = name.replace(/^[A-Z]{6}\+/, '');
  const family = name.split(/[-,]/)[0].replace(/(PS)?MT$/, '').replace(/([a-z])([A-Z])/g, '$1 $2');
  const generic = /courier|mono|consol/i.test(name) ? 'monospace'
    : /times|serif|roman|garamond|georgia|cambria|book/i.test(name) && !/sans/i.test(name) ? 'serif' : 'sans-serif';
  return { ps: name, family, generic, bold: /bold|black|heavy|semibold|demi/i.test(name), italic: /italic|oblique/i.test(name) };
}

// Couleur du fond (coin haut-gauche) et de l'encre (pixel le plus sombre) sous une zone de la page
function sample(wrap, x, y, w, h) {
  const c = wrap.querySelector('canvas'), k = c.width / wrap.clientWidth;
  const d = c.getContext('2d').getImageData(x * k, y * k, Math.max(1, w * k), Math.max(1, h * k)).data;
  let ink = [0, 0, 0], min = 766;
  for (let i = 0; i < d.length; i += 4) if (d[i] + d[i + 1] + d[i + 2] < min) { min = d[i] + d[i + 1] + d[i + 2]; ink = [d[i], d[i + 1], d[i + 2]]; }
  return { bg: `rgb(${d[0]},${d[1]},${d[2]})`, ink: '#' + ink.map(v => v.toString(16).padStart(2, '0')).join('') };
}

function editRun(span, wrap, p) {
  const r = span.run, { bg, ink } = sample(wrap, r.x, r.top, r.w, r.px * 1.1);
  span.remove();
  add({ type: 'text', p, x: r.x, y: r.top, text: r.str, size: r.px / S, color: ink, bg, font: fontOf(p, r.font), span,
        orig: { x: r.x, top: r.top, w: r.w, h: r.px } }, wrap);
}

function down(e, wrap, p) {
  if (e.button !== 0) return;
  const r = wrap.getBoundingClientRect(), pos = ev => [ev.clientX - r.left, ev.clientY - r.top];
  if (e.target.tagName === 'INPUT' && tool !== 'move') return; // clic dans un texte = on l'édite
  let [lx, ly] = pos(e), it, onMove;
  const cl = e.target.classList;
  if (cl.contains('sig') && e.offsetX > e.target.clientWidth - 16 && e.offsetY > e.target.clientHeight - 16) return; // poignée de redimensionnement native
  const drag = tool === 'move' || cl.contains('box') || cl.contains('sig'); // cadres de texte et signatures se déplacent avec tous les outils
  if (drag) {
    it = e.target.item;
    if (!it) return;
    onMove = ev => {
      const [x, y] = pos(ev);
      it.x += x - lx; it.y += y - ly;
      if ('x2' in it) { it.x2 += x - lx; it.y2 += y - ly; }
      [lx, ly] = [x, y];
      draw(it);
    };
  } else if (tool === 'edit') {
    if (cl.contains('tl')) editRun(e.target, wrap, p);
    e.preventDefault();
    return;
  } else if (tool === 'text') {
    add({ type: 'text', p, x: lx, y: ly - +$('size').value * S / 2, text: '' }, wrap);
    e.preventDefault();
    return;
  } else {
    it = add({ type: tool, p, x: lx, y: ly, x2: lx, y2: ly }, wrap);
    onMove = ev => { [it.x2, it.y2] = pos(ev); draw(it); };
  }
  e.preventDefault();
  wrap.setPointerCapture(e.pointerId);
  wrap.onpointermove = onMove;
  wrap.onpointerup = () => {
    wrap.onpointermove = wrap.onpointerup = null;
    if (!drag && Math.hypot(it.x2 - it.x, it.y2 - it.y) < 3) remove(it); // simple clic sans tracer
  };
}

function add(it, wrap) {
  it = { color: $('color').value, size: +$('size').value, w: +$('width').value, ...it };
  if (it.type === 'text') {
    it.el = document.createElement('div');
    it.el.className = 'box';
    it.input = document.createElement('input');
    it.input.item = it;
    it.input.value = it.text;
    it.input.oninput = () => { it.text = it.input.value; draw(it); };
    it.input.onblur = () => { if (!it.text.trim() && !it.orig) remove(it); }; // texte d'origine vidé = supprimé du PDF
    it.el.append(it.input);
    wrap.append(it.el);
    setTimeout(() => it.input.focus());
  } else if (it.type === 'sig') {
    it.el = document.createElement('div');
    it.el.className = 'sig';
    it.el.innerHTML = `<img src="${it.src}">`;
    Object.assign(it.el.style, { width: it.width + 'px', aspectRatio: it.ratio }); // largeur seule redimensionnable, ratio conservé
    wrap.append(it.el);
  } else {
    it.el = document.createElementNS('http://www.w3.org/2000/svg', it.type);
    wrap.querySelector('svg').append(it.el);
  }
  it.el.item = it;
  it.el.oncontextmenu = e => { e.preventDefault(); remove(it); };
  items.push(it);
  draw(it);
  return it;
}

function remove(it) {
  const i = items.indexOf(it);
  if (i < 0) return;
  items.splice(i, 1);
  if (it.span) it.el.after(it.span); // annule la modification : le texte d'origine redevient cliquable
  it.el.remove();
}

function draw(it) {
  const el = it.el, a = (k, v) => el.setAttribute(k, v);
  if (it.type === 'sig') return Object.assign(el.style, { left: it.x + 'px', top: it.y + 'px' });
  if (it.type === 'text') {
    const px = it.size * S, f = it.font;
    const family = f ? `"${f.family}", ${f.generic}` : 'Helvetica, Arial, sans-serif';
    const weight = f?.bold ? 'bold' : 'normal', style = f?.italic ? 'italic' : 'normal';
    measure.font = `${style} ${weight} ${px}px ${family}`;
    Object.assign(el.style, { left: it.x - 5 + 'px', top: it.y - 5 + 'px' }); // 5 = padding + bordure du cadre
    Object.assign(it.input.style, { height: px + 'px', fontSize: px + 'px', color: it.color, fontFamily: family,
                                    fontWeight: weight, fontStyle: style, background: it.bg || 'transparent',
                                    // un texte modifié couvre au moins l'ancien à l'écran (dans le PDF, l'ancien est supprimé)
                                    width: Math.max(measure.measureText(it.text).width + px, it.orig?.w || 0) + 'px' });
    return;
  }
  a('stroke', it.color); a('stroke-width', it.w * S); a('fill', 'none'); a('pointer-events', 'all');
  const x = Math.min(it.x, it.x2), y = Math.min(it.y, it.y2), w = Math.abs(it.x2 - it.x), h = Math.abs(it.y2 - it.y);
  if (it.type === 'rect') { a('x', x); a('y', y); a('width', w); a('height', h); }
  if (it.type === 'ellipse') { a('cx', x + w / 2); a('cy', y + h / 2); a('rx', w / 2); a('ry', h / 2); }
  if (it.type === 'line') { a('x1', it.x); a('y1', it.y); a('x2', it.x2); a('y2', it.y2); }
}

// Supprime vraiment du fichier le texte d'origine des morceaux modifiés (MuPDF, via des « caviardages » sans rectangle noir)
async function redact(edits) {
  const mupdf = await import('https://cdn.jsdelivr.net/npm/mupdf@1.28.1/dist/mupdf.js');
  const doc = mupdf.Document.openDocument(bytes, 'application/pdf'), pages = {};
  for (const it of edits) {
    const pg = pages[it.p] ??= doc.loadPage(it.p), o = it.orig;
    // bande intérieure au morceau : MuPDF retire tout glyphe qui la touche, on évite ainsi les voisins
    pg.createAnnotation('Redact').setRect([(o.x + 2) / S, (o.top + o.h * 0.35) / S, (o.x + o.w - 2) / S, (o.top + o.h * 0.75) / S]);
  }
  const P = mupdf.PDFPage;
  for (const pg of Object.values(pages)) pg.applyRedactions(false, P.REDACT_IMAGE_NONE, P.REDACT_LINE_ART_NONE, P.REDACT_TEXT_REMOVE);
  return doc.saveToBuffer('compress').asUint8Array();
}

// Police la plus fidèle possible : la vraie police si elle est installée sur le PC (Chrome/Edge), sinon une police standard proche
async function pdfFont(pdf, f, cache, localFonts) {
  const key = f ? f.ps + f.generic + f.bold + f.italic : '';
  if (cache[key]) return cache[key];
  const m = f && (localFonts.find(x => x.postscriptName === f.ps.replace(',', '-'))
    || localFonts.find(x => x.family === f.family && /bold/i.test(x.style) === f.bold && /italic|oblique/i.test(x.style) === f.italic));
  if (m) try { return cache[key] = await pdf.embedFont(await (await m.blob()).arrayBuffer(), { subset: true }); } catch {}
  const base = { serif: 'TimesRoman', monospace: 'Courier' }[f?.generic] || 'Helvetica';
  const name = base + (f?.bold ? 'Bold' : '') + (f?.italic ? (base === 'TimesRoman' ? 'Italic' : 'Oblique') : '');
  return cache[key] = await pdf.embedFont(PDFLib.StandardFonts[name]);
}

async function build(localFonts = []) {
  const { PDFDocument, rgb, degrees } = PDFLib;
  const edits = items.filter(it => it.orig);
  const pdf = await PDFDocument.load(edits.length ? await redact(edits) : bytes, { ignoreEncryption: true });
  pdf.registerFontkit(fontkit);
  const pages = pdf.getPages(), pngs = {}, fonts = {};
  for (const it of items) {
    const page = pages[it.p], P = (x, y) => viewports[it.p].convertToPdfPoint(x, y);
    if (it.type === 'sig') {
      const img = pngs[it.src] ??= await pdf.embedPng(it.src), w = it.el.offsetWidth, h = it.el.offsetHeight;
      const [x, y] = P(it.x, it.y + h); // coin bas-gauche à l'écran, comme la ligne de base d'un texte
      page.drawImage(img, { x, y, width: w / S, height: h / S, rotate: degrees(viewports[it.p].rotation) });
      continue;
    }
    const n = parseInt(it.color.slice(1), 16), color = rgb((n >> 16) / 255, (n >> 8 & 255) / 255, (n & 255) / 255);
    if (it.type === 'text') {
      if (!it.text.trim()) continue;
      const font = await pdfFont(pdf, it.font, fonts, localFonts);
      const [x, y] = P(it.x, it.y + 0.85 * it.size * S); // 0.85 ≈ position de la ligne de base dans le champ
      // page tournée (/Rotate) : on tourne le texte d'autant pour qu'il reste droit à l'écran
      page.drawText(it.text, { x, y, size: it.size, font, color, rotate: degrees(viewports[it.p].rotation) });
      continue;
    }
    const [x1, y1] = P(it.x, it.y), [x2, y2] = P(it.x2, it.y2);
    const x = Math.min(x1, x2), y = Math.min(y1, y2), w = Math.abs(x2 - x1), h = Math.abs(y2 - y1);
    if (it.type === 'rect') page.drawRectangle({ x, y, width: w, height: h, borderColor: color, borderWidth: it.w });
    if (it.type === 'ellipse') page.drawEllipse({ x: x + w / 2, y: y + h / 2, xScale: w / 2, yScale: h / 2, borderColor: color, borderWidth: it.w });
    if (it.type === 'line') page.drawLine({ start: { x: x1, y: y1 }, end: { x: x2, y: y2 }, thickness: it.w, color });
  }
  return pdf.save();
}

$('save').onclick = async () => {
  if (!bytes) return alert("Ouvre d'abord un PDF.");
  try {
    // demandé tout de suite, pendant le clic : le navigateur n'autorise l'accès aux polices du PC que sur une action de l'utilisateur
    const localFonts = window.queryLocalFonts && items.some(it => it.font) ? await queryLocalFonts().catch(() => []) : [];
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([await build(localFonts)], { type: 'application/pdf' }));
    a.download = fileName.replace(/\.pdf$/i, '') + ' - rempli.pdf';
    a.click();
  } catch (err) {
    alert(/WinAnsi|cannot encode/i.test(err.message)
      ? "Un texte contient un caractère que la police ne sait pas écrire (émoji, alphabet non latin…). Retire-le puis réessaie."
      : /encrypt|password/i.test(err.message) ? 'Ce PDF est protégé par un mot de passe : impossible de le modifier.'
      : "Erreur lors de l'enregistrement : " + err.message);
  }
};
</script>
</body>
</html>
